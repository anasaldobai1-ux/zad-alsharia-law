<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>زاد الشريعة والقانون</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .loading-box {
      max-width: 700px;
      margin: 30px auto;
      background: #fff;
      border: 1px solid #e4e8ef;
      border-radius: 16px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 5px 18px #17203308;
      display: none;
    }
  </style>
</head>

<body>

<header class="top">

  <nav>
    <a class="brand" href="index.html">
      زاد <b>الشريعة والقانون</b>
    </a>

    <a class="admin" href="admin.html">
      لوحة الإدارة
    </a>
  </nav>

  <section class="hero">

    <h1>ملخصات الشريعة والقانون</h1>

    <p>
      منصة تعليمية لتنظيم الملخصات والمذكرات والملفات الدراسية في مكان واحد.
    </p>

    <div class="search">

      <input
        id="q"
        type="text"
        placeholder="ابحث عن مادة أو ملخص..."
        onkeydown="if(event.key === 'Enter') load()"
      >

      <button onclick="load()">بحث</button>

    </div>

  </section>

</header>


<main>

  <div class="section-head">
    <h2>الأقسام</h2>
  </div>

  <div id="cats" class="chips"></div>


  <div class="section-head">
    <h2>أحدث المواد</h2>
  </div>

  <div id="cards" class="grid"></div>


  <div id="empty" class="loading-box">
    جاري تحميل المواد...
  </div>

</main>


<footer>
  © 2026 زاد الشريعة والقانون
</footer>


<!-- إعدادات Supabase -->
<script src="config.js"></script>


<script>

let db = null;
let selected = '';
let cachedCategories = [];


/* ================================
   الرسائل
================================ */

function showMessage(message) {

  const empty = document.getElementById('empty');
  const cards = document.getElementById('cards');

  empty.style.display = 'block';
  empty.textContent = message;

  cards.innerHTML = '';

}


function hideMessage() {

  document.getElementById('empty').style.display = 'none';

}


/* ================================
   عرض الملخصات
================================ */

function render(data) {

  const cards = document.getElementById('cards');

  if (!data || data.length === 0) {

    showMessage('لا توجد مواد منشورة حاليًا.');

    return;

  }

  cards.innerHTML = data.map(x => {

    const title = esc(x.title || '');
    const description = esc(x.description || '');
    const category = esc(x.categories?.name || 'عام');
    const id = encodeURIComponent(String(x.id || ''));

    let fileButton = '';

    if (x.file_url) {

      fileButton = `
        <a
          class="btn secondary"
          target="_blank"
          rel="noopener noreferrer"
          href="${esc(x.file_url)}"
        >
          الملف
        </a>
      `;

    }

    return `

      <article class="card">

        <span class="tag">
          ${category}
        </span>

        <h3>
          ${title}
        </h3>

        <p>
          ${description}
        </p>

        <div class="actions">

          <a
            class="btn"
            href="view.html?id=${id}"
          >
            قراءة
          </a>

          ${fileButton}

        </div>

      </article>

    `;

  }).join('');

  hideMessage();

}


/* ================================
   عرض الأقسام
================================ */

function renderCats(data) {

  const cats = document.getElementById('cats');

  cats.innerHTML = `

    <button
      class="chip ${selected === '' ? 'active' : ''}"
      onclick="selectCategory('')"
    >
      الكل
    </button>

    ${data.map(x => {

      const id = String(x.id);

      return `

        <button
          class="chip ${selected === id ? 'active' : ''}"
          onclick="selectCategory('${escapeAttribute(id)}')"
        >
          ${esc(x.name || '')}
        </button>

      `;

    }).join('')}

  `;

}


/* ================================
   اختيار القسم
================================ */

function selectCategory(id) {

  selected = String(id || '');

  renderCats(cachedCategories);

  load();

}


/* ================================
   الوضع التجريبي
================================ */

function demo() {

  cachedCategories = [

    {
      id: '1',
      name: 'الشريعة'
    },

    {
      id: '2',
      name: 'القانون'
    }

  ];

  renderCats(cachedCategories);


  render([

    {
      id: '',
      title: 'مثال: مدخل إلى أصول الفقه',

      description:
        'الموقع يعمل بنجاح. عند اتصال قاعدة البيانات ستظهر ملخصاتك هنا.',

      categories: {
        name: 'الشريعة'
      },

      file_url: ''

    }

  ]);

}


/* ================================
   تحميل الأقسام
================================ */

async function loadCategories() {

  try {

    const result = await db
      .from('categories')
      .select('*')
      .order('name');

    if (result.error) {

      console.error(
        'خطأ في تحميل الأقسام:',
        result.error
      );

      return;

    }

    cachedCategories = result.data || [];

    renderCats(cachedCategories);

  } catch (error) {

    console.error(
      'حدث خطأ أثناء تحميل الأقسام:',
      error
    );

  }

}


/* ================================
   تحميل الملخصات
================================ */

async function load() {

  if (!db) {

    demo();

    return;

  }


  const q =
    document.getElementById('q').value.trim();


  const empty =
    document.getElementById('empty');


  if (q || selected) {

    empty.style.display = 'block';
    empty.textContent = 'جاري البحث...';

  }


  try {

    let query = db
      .from('summaries')
      .select('*,categories(name)')
      .eq('published', true)
      .order('created_at', {
        ascending: false
      });


    if (q) {

      /*
        نستخدم البحث في العنوان والوصف والمحتوى.
        ونزيل الفاصلة من النص حتى لا تكسر صيغة OR.
      */

      const safeQ =
        q
          .replace(/,/g, ' ')
          .replace(/\(/g, ' ')
          .replace(/\)/g, ' ');


      query = query.or(

        `title.ilike.%${safeQ}%,description.ilike.%${safeQ}%,content.ilike.%${safeQ}%`

      );

    }


    if (selected) {

      query =
        query.eq(
          'category_id',
          selected
        );

    }


    const result =
      await query;


    if (result.error) {

      console.error(
        'خطأ في تحميل الملخصات:',
        result.error
      );

      demo();

      return;

    }


    render(result.data || []);

  } catch (error) {

    console.error(
      'حدث خطأ:',
      error
    );

    demo();

  }

}


/* ================================
   حماية النصوص
================================ */

function esc(value) {

  return String(value || '')
    .replace(
      /[&<>"']/g,
      function (m) {

        return {

          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'

        }[m];

      }
    );

}


function escapeAttribute(value) {

  return String(value || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");

}


/* ================================
   تشغيل Supabase
================================ */

async function startSupabase() {

  if (

    !window.supabase ||

    !window.SUPABASE_URL ||

    !window.SUPABASE_ANON_KEY

  ) {

    console.error(
      'بيانات Supabase غير موجودة.'
    );

    demo();

    return;

  }


  try {

    db =
      window.supabase.createClient(

        window.SUPABASE_URL,

        window.SUPABASE_ANON_KEY

      );


    await loadCategories();

    await load();

  } catch (error) {

    console.error(
      'فشل تشغيل Supabase:',
      error
    );

    demo();

  }

}


/* ================================
   تحميل مكتبة Supabase
================================ */

function loadSupabase() {

  const script =
    document.createElement('script');


  script.src =
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';


  script.onload = function () {

    startSupabase();

  };


  script.onerror = function () {

    console.error(
      'تعذر تحميل مكتبة Supabase.'
    );

    demo();

  };


  document.head.appendChild(script);

}


/* ================================
   بدء الموقع
================================ */

document.addEventListener(
  'DOMContentLoaded',
  function () {

    const empty =
      document.getElementById('empty');

    empty.style.display = 'block';
    empty.textContent = 'جاري تشغيل الموقع...';

    /*
      نبدأ تحميل Supabase بعد ظهور الصفحة
      حتى لا تمنع المكتبة الخارجية الموقع من الظهور.
    */

    loadSupabase();

  }
);

</script>

</body>
</html>
