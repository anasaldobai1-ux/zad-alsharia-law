<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الملخص</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><nav><a class="brand" href="index.html">زاد <b>الشريعة والقانون</b></a></nav></header><main><article id="article" class="article">جارٍ التحميل...</article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>let db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);let id=new URLSearchParams(location.search).get('id');(async()=>{let {data,error}=await db.from('summaries').select('*,categories(name)').eq('id',id).single();article.innerHTML=error?'<p>تعذر العثور على الملخص.</p>':`<span class="tag">${data.categories?.name||'عام'}</span><h1>${esc(data.title)}</h1><p>${esc(data.description||'')}</p><hr><div class="content">${esc(data.content||'').replace(/\\n/g,'<br>')}</div>${data.file_url?`<a class="btn" target="_blank" href="${data.file_url}">فتح الملف</a>`:''}`})();function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}</script></body></html>
